name: Version & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_version_bump:
        description: 'Skip version bumping for testing workflow logic'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

# Prevent concurrent version bumps
concurrency:
  group: version-release
  cancel-in-progress: false

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Wait for CI to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  version:
    name: Version
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    if: always() && (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch')
    outputs:
      # Only true when a release has actually been created (post-merge).
      # Opening a release PR sets this to false; the human must merge the
      # PR, and the next workflow run creates the tag/release and sets
      # this to true. This ensures downstream jobs (test, build, publish)
      # only run when there's a real release to test/build/publish.
      version_changed: ${{ steps.release.outputs.released }}
      new_version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
    permissions:
      contents: write        # Push commits and tags
      pull-requests: write   # Create the release PR
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    # We build from source (rather than using davegarvey/grubble@v5) so we can
    # dogfood new binary features immediately on merge, without waiting for a
    # release to update the @v5 tag.
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: true

    - name: Build grubble
      run: cargo build --release

    # Remove v* tags that are not reachable from main. These are leftovers
    # from previous failed runs that pushed to release/* branches but never
    # merged. Without this, the binary's `git tag v<version>` would fail with
    # "tag already exists". Only unreachable tags are removed — legitimate
    # tags (e.g. v5.1.0 on the current branch's history) are kept so the
    # binary can find the last tag and only analyze new commits.
    - name: Clean up stale tags
      run: |
        git fetch origin --tags
        git tag -l 'v*' | while read -r tag; do
          if ! git merge-base --is-ancestor "$tag" HEAD 2>/dev/null; then
            echo "Removing unreachable tag: $tag"
            git tag -d "$tag"
          fi
        done

    # Canonical release-please-style flow:
    #   1. Compute the next version (dry-run, no side effects).
    #   2. If the version would change, open or update a release PR on a
    #      release/v<version> branch. The PR contains the version bump
    #      commit + CHANGELOG entry. NO auto-merge — a human reviews and
    #      merges the PR.
    #   3. On the next push to main, detect the most recent merged release
    #      PR. If found, create the v<version> tag and GitHub Release on
    #      the merge commit (via the GitHub API). This is the canonical
    #      "tag on the main merge commit" pattern used by release-please.
    #
    # The previous flow pre-tagged the release branch commit, which had to
    # be preserved through the merge (vulnerable to orphaning on squash).
    # The canonical pattern sidesteps this entirely: the tag is created
    # AFTER the merge, on the merge commit, by definition correct.

    - name: Bump (dry-run)
      id: bump
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_version_bump != 'true'
      run: |
        VERSION_BEFORE=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
        # --raw --dry-run prints just the next version (no extra lines)
        # and exits 0 in all non-error cases. The "current" version is
        # already in Cargo.toml; the "next" version is what would be set
        # if a release happened. If they differ, a release is needed.
        VERSION_AFTER=$(./target/release/grubble --preset rust --raw --dry-run)
        if [ -z "$VERSION_AFTER" ]; then
          VERSION_AFTER="$VERSION_BEFORE"
        fi
        if [ "$VERSION_AFTER" != "$VERSION_BEFORE" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION_AFTER" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "version=$VERSION_AFTER" >> $GITHUB_OUTPUT
        fi

    - name: Detect merged release PR
      id: detect
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Find the most recent merged PR whose head branch matches
        # release/v<semver>. If found, emit its number and merge commit SHA.
        # The "Release merged PR" step below uses this to create the tag.
        PR_INFO=$(gh pr list \
          --state merged \
          --base main \
          --limit 20 \
          --json number,headRefName,mergeCommit,mergedAt \
          | jq -r '[.[] | select(.headRefName | test("^release/v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(.mergedAt) | last // empty')
        if [ -n "$PR_INFO" ] && [ "$PR_INFO" != "null" ]; then
          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
          MERGE_SHA=$(echo "$PR_INFO" | jq -r '.mergeCommit.oid')
          echo "merged=true" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
        else
          echo "merged=false" >> $GITHUB_OUTPUT
        fi

    - name: Open or update release PR
      # The Open and Release steps are independent. The Open step runs
      # whenever a new release is needed (Bump step detected warrants a
      # change), regardless of whether a previous release PR is still
      # being processed by the Release step. They do not race — the
      # workflow steps are sequential, and the Release step's `gh api`
      # calls are independent of the Open step's branch + PR creation.
      #
      # This is what makes the workflow correct after a "quiet period":
      # if v5.2.2 was released long ago and a new fix: lands on main,
      # the Bump step computes v5.2.3 (changed=true), the Detect step
      # still finds the old v5.2.2 release PR (merged=true), and the
      # Open step opens a fresh release PR for v5.2.3. Without the
      # decoupling here, the workflow would silently skip the new
      # release PR — which is the bug this fix addresses.
      if: steps.bump.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.bump.outputs.version }}"
        BRANCH="release/v${VERSION}"

        # Run grubble on the release branch: bumps Cargo.toml, updates
        # CHANGELOG.md. NO --tag here — the tag is created on the main
        # merge commit by the "Release merged PR" step after a human merges
        # the PR. Pre-tagging the release branch commit is what caused
        # repeated tag-orphaning issues (#73, PRs #76/#77/#78). The
        # canonical release-please pattern is to tag the merge commit.
        git checkout -B "${BRANCH}"
        ./target/release/grubble \
          --git-user-name "github-actions[bot]" \
          --git-user-email "41898282+github-actions[bot]@users.noreply.github.com" \
          --git-branch "${BRANCH}" \
          --preset rust \
          --changelog \
          --push \
          --force-push

        # Read the CHANGELOG entry to use as the PR body. This body then
        # flows through to the GitHub Release notes when the PR is merged
        # and --release-from-pr reads it. No external AI dependency needed.
        CHANGELOG_BODY=$(./target/release/grubble --changelog-entry || echo "")

        # Open or update the PR. We don't enable auto-merge — a human
        # reviews and merges the release PR. This is the canonical
        # release-please pattern.
        # Note: --force-push ensures the release branch is always reset
        # to the current main HEAD (plus the bump commit), even if the
        # remote branch has a different parent commit from a previous run.
        if gh pr view "${BRANCH}" >/dev/null 2>&1; then
          echo "PR already exists for ${BRANCH}; branch was force-pushed."
        else
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Release v${VERSION}" \
            --body "${CHANGELOG_BODY}"
          echo "Release PR opened for ${BRANCH}"
        fi

    - name: Release merged PR
      id: release
      if: steps.detect.outputs.merged == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PR_NUMBER="${{ steps.detect.outputs.pr_number }}"
        # Use grubble release to resolve the PR to a tag spec. The
        # subcommand validates the PR is merged, parses the version from
        # the head branch, and emits the merge commit SHA.
        RELEASE_JSON=$(./target/release/grubble --release-from-pr "${PR_NUMBER}" --output json)
        echo "$RELEASE_JSON" | jq .

        VERSION=$(echo "$RELEASE_JSON" | jq -r '.version')
        TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
        MAJOR_TAG=$(echo "$RELEASE_JSON" | jq -r '.major_tag_name')
        MERGE_SHA=$(echo "$RELEASE_JSON" | jq -r '.merge_commit_sha')
        BODY=$(echo "$RELEASE_JSON" | jq -r '.body')

        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "::error::Failed to resolve release for PR #${PR_NUMBER}"
          exit 1
        fi

        # Create the v<version> tag on the merge commit. The new flow always
        # tags the merge commit on first run, so there should never be a
        # stale tag at a different commit. If a tag does exist at a
        # different commit, that means the previous (broken) pre-tagging
        # flow left an orphan behind — error out and ask a maintainer to
        # clean it up rather than silently moving tags.
        RELEASED=false
        if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
          EXISTING_TAG_OBJ=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}")
          EXISTING_TAG_SHA=$(echo "$EXISTING_TAG_OBJ" | jq -r '.object.sha')
          EXISTING_TYPE=$(echo "$EXISTING_TAG_OBJ" | jq -r '.object.type')
          if [ "$EXISTING_TYPE" = "tag" ]; then
            EXISTING_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${EXISTING_TAG_SHA}" | jq -r '.object.sha')
          else
            EXISTING_SHA="$EXISTING_TAG_SHA"
          fi

          if [ "$EXISTING_SHA" = "$MERGE_SHA" ]; then
            echo "Tag ${TAG_NAME} already exists on ${MERGE_SHA}; nothing to do"
          else
            echo "::error::Tag ${TAG_NAME} exists on ${EXISTING_SHA} but the release PR merged at ${MERGE_SHA}."
            echo "::error::This usually means a previous workflow left an orphan tag."
            echo "::error::Fix: delete the orphan tag and re-run, e.g.:"
            echo "::error::  gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG_NAME}"
            exit 1
          fi
        else
          echo "Creating tag ${TAG_NAME} on ${MERGE_SHA}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG_NAME}" \
            -f "sha=${MERGE_SHA}"
          RELEASED=true
        fi

        # Update the v<major> floating tag to the same merge commit. Always
        # force — the v<major> tag moves forward on every release.
        if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" >/dev/null 2>&1; then
          echo "Updating floating tag ${MAJOR_TAG} to ${MERGE_SHA}"
          # -F (capital) sends "force=true" as a JSON boolean, -f (lower)
          # sends it as a string which the API rejects with 422.
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_TAG}" \
            -f "sha=${MERGE_SHA}" \
            -F "force=true" >/dev/null
        else
          echo "Creating floating tag ${MAJOR_TAG} on ${MERGE_SHA}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${MAJOR_TAG}" \
            -f "sha=${MERGE_SHA}"
        fi

        # Create the GitHub Release for the tag (if it doesn't exist yet).
        # The body is the release PR body; the CHANGELOG entry is what
        # callers will see most prominently.
        if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
          echo "Creating GitHub release for ${TAG_NAME}"
          gh release create "${TAG_NAME}" \
            --target "${MERGE_SHA}" \
            --title "v${VERSION}" \
            --notes "${BODY}" \
            --verify-latest
          RELEASED=true
        else
          echo "GitHub release for ${TAG_NAME} already exists"
        fi

        # Emit step outputs for downstream jobs. `released=true` is only
        # set when a new tag or release was created, so the downstream
        # jobs run exactly once per release.
        if [ "$RELEASED" = "true" ]; then
          echo "released=true" >> $GITHUB_OUTPUT
        else
          echo "released=false" >> $GITHUB_OUTPUT
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.version_changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache: true

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-release:
    name: Build Release
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: grubble-linux-x86_64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: grubble-linux-aarch64
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            name: grubble-macos-aarch64
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: grubble-windows-x86_64.exe
            cross: false

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag_name }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Install cross
        if: matrix.cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross --version

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          strip target/${{ matrix.target }}/release/grubble || true

      - name: Strip binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          strip target/${{ matrix.target }}/release/grubble || true

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz grubble
          cd -

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.name }}.zip grubble.exe
          cd -

      - name: Generate SHA256 checksums (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Generate SHA256 checksums (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.name }}.zip).Hash.ToLower()
          "$hash  ${{ matrix.name }}.zip" | Out-File -Encoding ASCII ${{ matrix.name }}.zip.sha256

      - name: Upload Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          files: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          files: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [test, build-release]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag_name }}
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
